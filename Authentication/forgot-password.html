<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot password | Municipal Health Office</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="https://your-municipal-website.gov.ph">
        <img
          class="brand-logo"
          src="/Media/MHO Logo.png"
          alt="Municipal Health Office seal"
        />
        <span>
          <span class="brand-name">Municipal Health Office</span>
          <span class="brand-sub">Jose Panganiban, Camarines Norte</span>
        </span>
      </a>
    </header>

    <main>
      <section class="hero">
        <h1>Forgot <span>Password?</span></h1>
        <p>We’ll email you a link to reset it</p>
      </section>

      <div class="card-wrap">
        <div class="card">
          <h2>Reset your password</h2>
          <p class="lead">Enter the email you registered with</p>

          <form id="form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <div class="input">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="M3 7l9 6 9-6" />
                </svg>
                <input
                  id="email"
                  type="email"
                  placeholder="JohnDoe@gmail.com"
                  autocomplete="email"
                  data-rule="email"
                />
              </div>
              <p class="error-msg">Enter a valid email address.</p>
            </div>

            <p class="form-error" role="alert" hidden></p>
            <button class="btn" type="submit">Send reset link</button>
            <p class="switch">
              Remembered it? <a href="signin.html">Back to log in</a>
            </p>
          </form>

          <div class="success" id="success" role="status" hidden>
            <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
              <circle cx="26" cy="26" r="24" />
              <path d="M15 27l8 8 14-16" />
            </svg>
            <p id="successMsg"></p>
            <a href="signin.html" id="successLink" hidden></a>
          </div>
        </div>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="forgot-password.js"></script>
  </body>
</html>
